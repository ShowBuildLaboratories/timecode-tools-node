# Builds the native module for 9 platforms, tests the binaries, packs them
# into one npm package (all binaries in prebuilds/), and publishes it after a
# manual approval on the "release" environment.
#
# Trigger: push a tag like v0.1.0, or run manually. Manual runs stop after
# packing unless "publish" is checked.
#
# Before the first release:
#   - Create the "release" environment (Settings > Environments) with
#     required reviewers, so the publish job waits for approval.
#   - Add the NPM_TOKEN secret to that environment (an npm automation token),
#     or set up npm trusted publishing for this workflow and drop the token.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (after approval)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Git ref of https://github.com/ShowBuildLaboratories/timecode-tools-rs to
  # build against while the crate is used by path. Not needed once
  # Cargo.toml uses the crates.io release (see CONTRIBUTING.md).
  CORE_REF: main

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-14, target: aarch64-apple-darwin }
          - { host: macos-14, target: x86_64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-latest, target: aarch64-pc-windows-msvc }
          # glibc 2.17 toolchain from napi-rs, so binaries run on old distros
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: armv7-unknown-linux-gnueabihf, flags: --use-napi-cross }
          # musl via cargo-zigbuild
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: --cross-compile, zig: true }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: --cross-compile, zig: true }
    defaults:
      run:
        working-directory: timecode-tools-node
    steps:
      # Keep files byte for byte (goldens/ is compared with the core's copy).
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v4
        with:
          path: timecode-tools-node
      - uses: actions/checkout@v4
        with:
          repository: ShowBuildLaboratories/timecode-tools-rs
          ref: ${{ env.CORE_REF }}
          path: timecode-tools-rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: timecode-tools-node
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.flags }} --output-dir prebuilds --no-js
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: timecode-tools-node/prebuilds/*.node
          if-no-files-found: error

  test:
    name: Test ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, host: macos-14 }
          - { name: macOS x64, host: macos-13 }
          - { name: Windows x64, host: windows-latest }
          - { name: Windows arm64, host: windows-11-arm }
          - { name: Linux x64 glibc, host: ubuntu-latest }
          - { name: Linux arm64 glibc, host: ubuntu-24.04-arm }
          - { name: Linux x64 musl, host: ubuntu-latest, container: 'node:22-alpine' }
          # armv7 and arm64 musl are built but not run on hardware here.
    container: ${{ matrix.container }}
    steps:
      # Keep files byte for byte (goldens/ is compared with the core's copy).
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ !matrix.container }}
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: prebuilds
          merge-multiple: true
      - run: npm test

  package:
    name: Pack
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      # Keep files byte for byte (goldens/ is compared with the core's copy).
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: prebuilds
          merge-multiple: true
      - run: npm run check:prebuilds
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: timecode-tools-*.tgz
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: release # waits for a manual approval
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - run: npm publish timecode-tools-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
