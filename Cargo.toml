[package]
name = "timecode-tools-node"
description = "Node.js bindings for timecode-tools (published to npm as `timecode-tools`)"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Takashi Funama <support@showbuildlabs.com>"]
repository = "https://github.com/ShowBuildLaboratories/timecode-tools-node"
# Distributed through npm only.
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
# Tested from JavaScript (__test__/); a Rust test binary cannot link N-API.
test = false
doctest = false

[dependencies]
# The Rust core lives in https://github.com/ShowBuildLaboratories/timecode-tools-rs.
# Until it is on crates.io, it is used from a checkout next to this one
# (../timecode-tools-rs). For a release this becomes
#   timecode-tools = "=0.1.0"
# See CONTRIBUTING.md.
timecode-tools = { path = "../timecode-tools-rs/crates/timecode-tools", version = "=0.1.0" }
napi = { version = "=3.13.0", default-features = false, features = ["napi4"] }
napi-derive = "=3.6.9"

[build-dependencies]
napi-build = "=2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
